# Stack complète : PostgreSQL + Next.js (build production « standalone »).
#
# Démarrage : docker compose up -d --build
# URL : http://localhost:3000  (ou le port défini par WEB_HOST_PORT dans .env)
#
# Si « bind: ... 3000 ... Only one usage » : le port 3000 est déjà pris (ex. npm run start).
#   - Arrêtez l’autre processus, ou
#   - Dans .env : WEB_HOST_PORT=3001  puis ouvrez http://localhost:3001
#
# Migrations : appliquées automatiquement au démarrage du conteneur `web` (voir scripts/docker-entrypoint.sh).
# Hors Docker, depuis nextjs-sondage : npm run db:migrate (DATABASE_URL dans .env).
#
# Arrêt : docker compose down  (ajouter -v pour supprimer les données Postgres)

services:
  db:
    image: postgres:16-alpine
    container_name: sondage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sondage
      POSTGRES_PASSWORD: sondage_dev
      POSTGRES_DB: sondage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sondage -d sondage"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sondage-web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://sondage:sondage_dev@db:5432/sondage?schema=public
      NODE_ENV: production
      # Postgres est déjà « healthy » : pas besoin d’attendre avant migrate (voir scripts/docker-entrypoint.sh)
      MIGRATE_BOOT_SLEEP: "0"
      MIGRATE_MAX_ATTEMPTS: "5"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
